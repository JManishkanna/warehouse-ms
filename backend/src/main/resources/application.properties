# Application Configuration
spring.application.name=warehouse-ms

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warehouse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=${PORT:8081}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5111,http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.wms=INFO
logging.level.org.springframework.security=WARN
